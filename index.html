<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiwibase</title>
  <meta name="description" content="Kiwibase: one account and one profile for Cyberpunk Green, UmaCollector and TerminuxMC.">
  <meta name="theme-color" content="#0f1110">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?b=20261125054317">
</head>
<body>
  <header class="topbar">
    <button type="button" class="icon-btn menu-btn" id="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line class="bar bar-1" x1="4" y1="6" x2="20" y2="6"/>
          <line class="bar bar-2" x1="4" y1="12" x2="20" y2="12"/>
          <line class="bar bar-3" x1="4" y1="18" x2="20" y2="18"/>
        </g>
      </svg>
    </button>
    <a class="brand" href="#/">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#6b4a2b"/>
        <circle cx="16" cy="16" r="12.5" fill="#7cc94f"/>
        <circle cx="16" cy="16" r="8" fill="#b7e68f"/>
        <g fill="#1f1a14">
          <ellipse cx="16" cy="9.6" rx="0.9" ry="1.5"/>
          <ellipse cx="16" cy="22.4" rx="0.9" ry="1.5"/>
          <ellipse cx="9.6" cy="16" rx="1.5" ry="0.9"/>
          <ellipse cx="22.4" cy="16" rx="1.5" ry="0.9"/>
          <ellipse cx="11.5" cy="11.5" rx="0.9" ry="1.4" transform="rotate(-45 11.5 11.5)"/>
          <ellipse cx="20.5" cy="20.5" rx="0.9" ry="1.4" transform="rotate(-45 20.5 20.5)"/>
          <ellipse cx="20.5" cy="11.5" rx="0.9" ry="1.4" transform="rotate(45 20.5 11.5)"/>
          <ellipse cx="11.5" cy="20.5" rx="0.9" ry="1.4" transform="rotate(45 11.5 20.5)"/>
        </g>
        <circle cx="16" cy="16" r="2.6" fill="#eef7e4"/></svg>
      <span>Kiwibase</span>
    </a>
    <div class="search bar-search" data-search>
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2"/></svg>
      <input type="search" placeholder="Search people" aria-label="Search people" autocomplete="off"
        role="combobox" aria-expanded="false" aria-autocomplete="list">
      <ul class="suggest" role="listbox"></ul>
    </div>
    <div class="topbar-end">
      <div class="auth-tab bar-auth" data-auth-tab></div>
    </div>
  </header>

  <nav class="drawer" id="drawer" aria-label="Menu">
    <div class="search drawer-search" data-search>
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2"/></svg>
      <input type="search" placeholder="Search people" aria-label="Search people" autocomplete="off"
        role="combobox" aria-expanded="false" aria-autocomplete="list">
      <ul class="suggest" role="listbox"></ul>
    </div>
    <a href="#/">Home</a>
    <a href="#/me" data-needs-user>My profile</a>
    <a href="#/settings" data-needs-user>Settings</a>
    <div class="auth-tab drawer-auth" data-auth-tab></div>
  </nav>
  <div class="scrim" id="scrim"></div>

  <main id="app" class="page" tabindex="-1"></main>

  <footer class="footer">
    <span>Kiwibase</span>
  </footer>

  <script src="js/themes.js?b=20261125054317"></script>
  <script src="js/main.js?b=20261125054317"></script>
  <script type="module" src="js/app.js?b=20261125054317"></script>
</body>
</html>
